[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-bazi"
version = "0.3.0"
description = "Deterministic, auditable BaZi calculation API"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.5",
  "cryptography==45.0.6",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "lunar-python==1.4.8",
  "pymysql==1.1.1",
  "pydantic==2.11.7",
  "sqlalchemy==2.0.43",
  "tzdata==2025.2",
  "uvicorn==0.35.0",
]

[project.scripts]
bazi-worker = "app.worker:main"

[project.optional-dependencies]
dev = [
  "mypy==1.17.0",
  "pytest==8.4.1",
  "ruff==0.12.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
